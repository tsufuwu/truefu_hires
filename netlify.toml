# Netlify Configuration for Truefu Hires
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA routing redirect for React Router / client-side states
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Recommended security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
